name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本号（如 v0.1.0-rc.1；缺省使用 package.json 的 version）
        required: false
        type: string
        default: ""
      prerelease:
        description: 发布为 pre-release
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64
            name: macos
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    env:
      MISE_ENV: "ci"

    steps:
      - name: Checkout 工作区
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: 安装 Linux 系统依赖（Wails gtk4 路径）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev \
            libglib2.0-dev libx11-dev

      - name: 安装依赖
        run: pnpm install

      - name: 解析版本号并同步 package.json
        id: version
        shell: bash
        env:
          SYNC_PKG_VERSION: "1"
        run: pnpm exec tsx scripts/release/version.ts

      - name: 打包（bundle --force）
        shell: bash
        # run step 默认工作目录即 ${{ github.workspace }}，justfile 的 `.` 即工作区；
        # 显式传 workspace 会与 `.` 构成两个位置参数，Windows 下路径拼接出错。
        run: |
          just bundle --force

      - name: 整理产物（压缩 / 重命名）
        shell: bash
        env:
          PLATFORM: ${{ matrix.name }}
          VERSION: ${{ steps.version.outputs.version }}
          RUNNER_ARCH: ${{ runner.arch }} # X64 / ARM64（用于产物文件名）
          WORKSPACE: ${{ github.workspace }}
        run: pnpm exec tsx scripts/release/package.ts

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-coding-${{ matrix.name }}-${{ runner.arch }}
          path: ${{ github.workspace }}/target/dsh-coding/dsh-coding-${{ steps.version.outputs.version }}-*
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 工作区
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: 安装依赖
        run: pnpm install

      - name: 汇总各平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 解析版本号
        id: version
        shell: bash
        env:
          ARTIFACTS_DIR: artifacts
        run: pnpm exec tsx scripts/release/version.ts

      - name: 创建/更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: dsh-coding ${{ steps.version.outputs.version }}
          prerelease: ${{ inputs.prerelease == true || contains(steps.version.outputs.version, '-') }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
